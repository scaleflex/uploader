<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Scaleflex Uploader — Dev</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        font-family: 'Inter', system-ui, sans-serif;
        background: #f8fafc;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 40px 20px;
        gap: 24px;
      }
      .config-panel {
        width: 100%;
        max-width: 640px;
        background: #fff;
        border: 1px solid #e2e8f0;
        border-radius: 12px;
        padding: 20px 24px;
      }
      .config-panel h3 {
        font-size: 14px;
        font-weight: 700;
        color: #334155;
        margin-bottom: 14px;
      }
      .config-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
      }
      .config-grid .full-width {
        grid-column: 1 / -1;
      }
      .config-grid > label {
        display: flex;
        flex-direction: column;
        gap: 4px;
        font-size: 12px;
        font-weight: 600;
        color: #64748b;
      }
      .config-grid input {
        height: 36px;
        padding: 0 10px;
        border: 1px solid #e2e8f0;
        border-radius: 8px;
        font-family: 'Inter', system-ui, sans-serif;
        font-size: 13px;
        color: #1e293b;
        outline: none;
        transition: border-color 0.15s;
      }
      .config-grid input:focus {
        border-color: #2563eb;
      }
      .config-grid label.checkbox {
        flex-direction: row;
        align-items: center;
        gap: 8px;
        font-size: 13px;
        font-weight: 600;
        color: #334155;
        cursor: pointer;
      }
      .config-grid label.checkbox input {
        width: 16px;
        height: 16px;
        accent-color: #2563eb;
        cursor: pointer;
      }
      .apply-btn {
        margin-top: 14px;
        height: 36px;
        padding: 0 20px;
        border: none;
        border-radius: 8px;
        background: #2563eb;
        color: #fff;
        font-family: inherit;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        transition: background 0.15s;
      }
      .apply-btn:hover {
        filter: brightness(0.88);
      }
      sfx-uploader {
        width: 100%;
        max-width: 1200px;
        /* Brand primary — the whole widget (incl. Check similar) inherits this. */
        --primary: #496ced;
      }
    </style>
    <script type="module" src="./main.ts"></script>
  </head>
  <body>
    <div class="config-panel">
      <h3>Filerobot Config</h3>
      <div class="config-grid">
        <label>
          Container
          <input id="cfg-container" type="text" value="fbmjmuoeb" placeholder="e.g. fbmjmuoeb" />
        </label>
        <label>
          Security Template ID
          <input id="cfg-sec-template" type="text" value="SECU_A850ED0F0E254CB8A3AD3E1297CF204E" placeholder="SECU_..." />
        </label>
        <label>
          Target Folder
          <input id="cfg-folder" type="text" value="/Documents" placeholder="/uploads/" />
        </label>
        <label>
          Airbox PUID (optional)
          <input id="cfg-airbox-puid" type="text" value="unhxiA0WHiB0SFhHGL8DVr1SbS" placeholder="optional" />
        </label>
        <label class="checkbox full-width">
          <input id="cfg-similarity-check" type="checkbox" />
          Enable “Check similar assets”
        </label>
      </div>
      <div style="display: flex; gap: 10px; margin-top: 14px; flex-wrap: wrap;">
        <button class="apply-btn" id="cfg-apply" style="margin-top: 0;">Show Inline</button>
        <button class="apply-btn" id="cfg-modal" style="margin-top: 0; background: #6366f1;">Open in Modal</button>
        <button class="apply-btn" id="cfg-step" style="margin-top: 0; background: #8b5cf6;">Open in Modal as Step</button>
        <button class="apply-btn" id="cfg-cards" style="margin-top: 0; background: #059669;">Cards Layout</button>
        <button class="apply-btn" id="cfg-lang" style="margin-top: 0; background: #0891b2;">Lang: EN</button>
      </div>
    </div>
    <sfx-uploader id="uploader"></sfx-uploader>
  </body>
</html>
